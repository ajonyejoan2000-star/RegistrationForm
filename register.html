<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registration Form</title>
<link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="wrapper">
    <h1>Registration Form</h1>
  <form id="regForm" novalidate>
    <div>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" name="name" />
      <div class="error" id="nameError"></div>
    </div>

    <div>
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter your Mobile number" name="mobile" />
      <div class="error" id="mobileError"></div>
    </div>

    <div>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your Email" name="email" />
      <div class="error" id="emailError"></div>
    </div>

    <div>
      <label for="language">Language</label>
      <select id="language" name="language">
        <option value="">--Select--</option>
        <option value="english">English</option>
        <option value="spanish">Spanish</option>
        <option value="mandarin">Mandarin</option>
        <option value="french">French</option>
      </select>
      <div class="error" id="languageError"></div>
    </div>

    <div>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your Password" name="password" />
      <div class="error" id="passwordError"></div>
    </div>

    <div>
      <label for="attachment">Attachment</label>
      <input type="file" id="attachment" name="attachment" />
      <div class="error" id="attachmentError"></div>
    </div>

    <div>
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Enter your Password" name="confirmPassword" />
      <div class="error" id="confirmPasswordError"></div>
    </div>

    <div>
      <label>Gender</label>
      <div class="gender-options">
        <label><input type="radio" name="gender" value="male" /> Male</label>
        <label><input type="radio" name="gender" value="female" /> Female</label>
      </div>
      <div class="error" id="genderError"></div>
    </div>

    <div class="terms full-width">
      <label><input type="checkbox" id="terms" /> I accept the terms of use</label>
      <div class="error" id="termsError"></div>
    </div>

    <button type="submit">Register Now</button>
  </form>
    </div>
 <!-- Links the js file and ensures it runs after HTML is parsed -->
<script src="register.js" defer></script>
</body>
</html>
